# Fork-only: rebuild PREPARATION as apache/hadoop trunk plus this fork's
# .github/ with .github/scripts/rebuild-preparation.sh, and force-push it.
# Merged JIRA pull requests are dropped from PREPARATION; their upstream
# branches have already been built by "Upstream branch", which calls this
# workflow once it is done (workflow_dispatch would need the file on trunk).
#
# Pushes with the PREPARATION_PUSH_TOKEN secret when it is set (a token with
# contents and workflows write access), otherwise with GITHUB_TOKEN.

name: "Rebuild PREPARATION"

on:
  workflow_call:

permissions:
  contents: write

jobs:
  rebuild-preparation:
    name: Rebuild PREPARATION
    runs-on: ubuntu-24.04
    # One rebuild at a time; a newer one always sees the latest PREPARATION.
    concurrency:
      group: rebuild-preparation
      cancel-in-progress: false
    steps:
      - name: Checkout PREPARATION
        uses: actions/checkout@v4
        with:
          ref: PREPARATION
          fetch-depth: 0
          token: ${{ secrets.PREPARATION_PUSH_TOKEN || github.token }}
      - name: Rebuild and push PREPARATION
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old_commit=$(git rev-parse HEAD)
          # Keep a copy of the script: it checks out apache/hadoop trunk.
          script="${RUNNER_TEMP}/rebuild-preparation.sh"
          cp .github/scripts/rebuild-preparation.sh "${script}"
          status=0
          SOURCE_COMMIT="${old_commit}" bash "${script}" PREPARATION \
            | tee "${RUNNER_TEMP}/rebuild.log" || status=$?
          if [[ ${status} -eq 3 ]]; then
            echo "::notice::PREPARATION is already apache/hadoop trunk plus .github/."
            exit 0
          elif [[ ${status} -ne 0 ]]; then
            exit "${status}"
          fi
          # Fails instead of overwriting if PREPARATION moved in the meantime.
          git push --force-with-lease="PREPARATION:${old_commit}" origin PREPARATION
          {
            echo "### PREPARATION rebuilt"
            echo
            echo "Previous PREPARATION: \`${old_commit}\`. To undo:"
            echo
            echo "\`git push --force origin ${old_commit}:PREPARATION\`"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/rebuild.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::PREPARATION rebuilt on apache/hadoop trunk (was ${old_commit})."
