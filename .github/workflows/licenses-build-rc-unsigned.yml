# W2 of the RM toolbelt (requirement 44 / HADOOP-20078 increment 1,
# optional): build an UNSIGNED release-candidate bundle so the release
# manager does not need to maintain a Docker build host for the heavy
# part. Dispatch on the release tag or branch; the run:
#   1. builds the dist tarballs exactly as "Archive license ground
#      truth" does (same build-env image, same Maven invocation, cloud
#      package profiles enabled) plus the THIRD-PARTY inventory;
#   2. runs dev-support/licenses/run-release-checks.sh in release mode —
#      the ONE fail-closed license step: enumerate, gate, generate,
#      drift-check (R36/R38/R39/R47/R26/R27, R7 assets, R10/R40, R53,
#      R14);
#   3. GREEN: publishes the ready-to-sign bundle — tarballs + sha512,
#      THIRD-PARTY.txt, the generated LICENSE-binary and
#      licenses-binary/, and the RM offline checklist (the exact
#      remaining commands). RED: publishes the fix list instead.
# The credential-bearing steps (sign, stage to SVN, Nexus close, signed
# tag, vote email) stay with the RM — run-release-checks.sh never
# performs them; CHECKLIST.md in the bundle lists them in order.
# Nothing here is a release procedure change: this workflow only
# prepares; the RM's own signed build remains the official path.

name: "Licenses: build unsigned RC bundle"

on:
  workflow_dispatch:

permissions:
  contents: read
  # write: the build-env image cache (see licenses-dist.yml)
  packages: write
  actions: read

env:
  CHECKS_OUT: target/release-checks

jobs:
  build-rc-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare bind-mount sources for the Docker build env
        run: mkdir -p "$HOME/.m2/repository" "$HOME/.gnupg"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide the build-env image (GHCR cache, else wait or build)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_STEP: Provide the build-env image (GHCR cache, else wait or build)
        run: dev-support/licenses/build-env-image.sh

      # R13: the assemblies copy licenses-binary/ during the reactor, so
      # it must exist before the build (same as the dist workflow)
      - name: Generate the bundled license texts for the assemblies
        run: |
          rm -rf licenses-binary
          python3 dev-support/licenses/generate-archive-manifest.py \
            --emit-licenses-dir-only --manifest LICENSE-binary \
            --licenses-dir licenses-binary

      # same build the ground-truth workflow validates on every push:
      # dist + native + yarn-ui + all cloud package profiles, then the
      # THIRD-PARTY collection, in one reactor pass inside the Docker
      # build env
      - name: Build dist tarballs and inventory (Docker build env)
        env:
          HADOOP_BUILD_ENV_PREBUILT: '1'
        run: >-
          DOCKER_INTERACTIVE_RUN= ./start-build-env.sh ubuntu_24 bash -c
          'mvn -B -ntp install -Pdist,native,yarn-ui -DskipTests -Dtar
          -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -Drat.skip=true
          -Dspotbugs.skip=true
          -Dhadoop-aliyun-package -Dhadoop-aws-package
          -Dhadoop-azure-datalake-package -Dhadoop-bos-package
          -Dhadoop-cos-package -Dhadoop-gcp-package
          -Dhadoop-huaweicloud-package -Dhadoop-tos-package
          && mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party'

      # the ONE license step, on the exact tarballs this run built
      - name: Run the release license step (fail-closed)
        run: |
          set -euo pipefail
          dev-support/licenses/run-release-checks.sh \
            --tarballs hadoop-dist/target \
                       hadoop-cloud-storage-project/hadoop-cloud-storage-dist/target \
            --repo . --out "$CHECKS_OUT"

      # the bundle is the artifact: unsigned, unstaged, license-verified.
      # On RED the checks/ directory carries the fix list and per-check
      # logs instead — upload that too so the fix is actionable.
      - name: Upload the RC bundle (GREEN) or the fix list (RED)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-unsigned-bundle
          path: |
            ${{ env.CHECKS_OUT }}/rc-bundle/**
            ${{ env.CHECKS_OUT }}/generated-LICENSE-binary
            ${{ env.CHECKS_OUT }}/licenses-binary/**
            ${{ env.CHECKS_OUT }}/checks/**
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          { echo "## Release license step"
            if [[ -f "$CHECKS_OUT/rc-bundle/CHECKLIST.md" ]]; then
              echo "GREEN — ready-to-sign bundle in the \`rc-unsigned-bundle\` artifact."
              echo "Next: the RM offline checklist in the bundle (sign, stage, Nexus, tag, vote)."
            else
              echo "RED — fix list in the \`rc-unsigned-bundle\` artifact (\`checks/\`):"
              echo '```'
              cat "$CHECKS_OUT/fixlist.txt" 2>/dev/null || true
              echo '```'
              echo "Fix the named configuration files in a reviewed PR and re-dispatch."
            fi; } >> "$GITHUB_STEP_SUMMARY"
