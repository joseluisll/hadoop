name: "Yetus"

# Runs the same precommit as the ASF Jenkins job in dev-support/Jenkinsfile:
# the same Yetus build, the Ubuntu Noble run on every change, and the optional
# Rocky Linux 8 and Debian 13 runs that jenkins.sh only carries out when a
# change touches C/C++ code or the build platform.
#
# Fork-only: only runs when requested, for the <name> branch an
# apache/hadoop pull request is opened from (published by
# build_upstream.yml). Request it by pushing a yetus/<name> branch that
# carries this file, e.g.:
#
#   git push origin PREPARATION:yetus/HADOOP-12345
#
# (workflow_dispatch would need this file on trunk, the fork's default
# branch). yetus/<name>-upstream tests a <name>-upstream branch, for pull
# requests opened before feat/ branches. The request branch is deleted right
# away, so the same push works again later. Yetus tests the branch's current
# commit as a patch on apache/hadoop trunk, as Jenkins tests an
# apache/hadoop pull request.
# Results stay in the run (job summary and report artifact), and the run
# reports on the <name> commit as its "Yetus" commit status, next to the checks
# of its Build run. GitHub lists the run itself under the request branch: a push
# run takes its file from the pushed commit, and <name> must not carry this
# file. A status belongs to a commit, so publishing <name> again clears it.

run-name: "Yetus: ${{ github.ref_name }}"

on:
  push:
    # Any yetus/<branch> request, JIRA or not (the jetty-phase-* harness
    # branches included). The branch it names is looked up next, so a request
    # that names no branch of the fork fails there with a message saying so.
    branches:
      - "yetus/**"

permissions:
  contents: read

env:
  # a7d29a6 changed GitHub PR patch downloads in a way that fails in Actions.
  YETUS_REPOSITORY: ayushtkn/yetus
  YETUS_VERSION: 730e8612d10cee53777e9a0f08fcceda205f0e0a
  # Prebuilt build images that apache/hadoop's "Image Cache" workflow
  # publishes from dev-support/docker on trunk. Reusing them avoids building
  # the whole toolchain image on every run.
  BUILD_IMAGE_PREFIX: ghcr.io/apache/hadoop/gha-build-
  BUILD_IMAGE_SUFFIX: -image-cache:trunk-static

jobs:
  request:
    name: Read the request
    # Not when a request branch is deleted.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    permissions:
      # To delete the request branch.
      contents: write
      # To report on the upstream commit.
      statuses: write
    outputs:
      branch: ${{ steps.request.outputs.branch }}
      commit: ${{ steps.request.outputs.commit }}
    steps:
      - name: Find the upstream branch and delete the request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=${GITHUB_REF_NAME#yetus/}
          commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" \
            --jq .object.sha 2>/dev/null) || commit=
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
          if [[ -z "${commit}" ]]; then
            echo "::error::There is no ${branch} branch to test; publish it first: git push origin PREPARATION:build/${branch}"
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${commit}" --silent \
            -f state=pending -f context=Yetus -f description="Running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::notice::Testing ${branch} at ${commit}."

  yetus:
    name: Yetus precommit (${{ matrix.platform }})
    needs: request
    # Fork-only: the local runner in ~/code/action-runner (label "self-hosted")
    # runs the precommit; the request and report jobs stay on GitHub, as they
    # only call the API. Yetus still builds and tests inside Docker, in the
    # same image, so the result is the one Jenkins gives.
    runs-on: self-hosted
    # A self-hosted runner has no 6-hour limit of its own. This one has 8
    # cores, so a full precommit takes hours; leave it room to finish.
    timeout-minutes: 2880
    continue-on-error: ${{ matrix.optional == '1' }}
    # A newer request for the same branch replaces the one being tested.
    concurrency:
      group: yetus-${{ needs.request.outputs.branch }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-noble
            os: ubuntu_24
            optional: "0"
          - platform: rockylinux-8
            os: rockylinux_8
            optional: "1"
          - platform: debian-13
            os: debian_13
            optional: "1"
    env:
      WORKSPACE: ${{ github.workspace }}
      YETUS: yetus
      SOURCEDIR: ${{ github.workspace }}/src
      PATCHDIR: ${{ github.workspace }}/out
      DOCKERFILE: ${{ github.workspace }}/yetus-base/Dockerfile
      IS_OPTIONAL: ${{ matrix.optional }}
      PLATFORM: ${{ matrix.platform }}
      UPSTREAM_BRANCH: ${{ needs.request.outputs.branch }}
      UPSTREAM_COMMIT: ${{ needs.request.outputs.commit }}
      # Outside SOURCEDIR, which Yetus resets and cleans.
      PATCH_FILE: ${{ github.workspace }}/patch/${{ needs.request.outputs.branch }}.patch
    steps:
      - name: Checkout apache/hadoop trunk
        # Yetus resets SOURCEDIR to trunk and pulls it from origin, so origin
        # must be apache/hadoop.
        uses: actions/checkout@v4
        with:
          repository: apache/hadoop
          ref: trunk
          path: src
          fetch-depth: 0
      - name: Make the patch from ${{ needs.request.outputs.branch }}
        # jenkins.sh decides whether the optional platforms run from what
        # HEAD changes against origin/trunk, so HEAD is the upstream commit.
        run: |
          git -C "${SOURCEDIR}" fetch --quiet --no-tags \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${UPSTREAM_COMMIT}"
          git -C "${SOURCEDIR}" checkout --quiet --detach "${UPSTREAM_COMMIT}"
          base=$(git -C "${SOURCEDIR}" merge-base origin/trunk HEAD)
          mkdir -p "$(dirname "${PATCH_FILE}")"
          git -C "${SOURCEDIR}" format-patch --stdout "${base}..HEAD" > "${PATCH_FILE}"
          git -C "${SOURCEDIR}" log --oneline "${base}..HEAD"
      - name: Checkout Yetus
        uses: actions/checkout@v4
        with:
          repository: ${{ env.YETUS_REPOSITORY }}
          ref: ${{ env.YETUS_VERSION }}
          path: yetus
      - name: Use the Apache trunk build image, as an account it has
        # Yetus builds whatever --dockerfile names as its base image. A single
        # FROM line makes that build a pull of the published image, and only
        # when jenkins.sh actually runs Yetus for this platform.
        #
        # Fork-only, from the second RUN on: Yetus then builds a run-specific
        # image that adds the runner's own account and runs the container as
        # it, by name. This runner's account is not in these images, and in
        # the Ubuntu one its id (1000) is already taken by 'ubuntu', so the
        # account is never added and docker run fails with "no matching
        # entries in passwd file". The second RUN adds 'ubuntu' at the
        # runner's own id where the image lacks it (that is where the Ubuntu
        # image has it), and the next step names it to Yetus.
        run: |
          mkdir -p "$(dirname "${DOCKERFILE}")"
          runner_id=$(id -u)
          {
            echo "FROM ${BUILD_IMAGE_PREFIX}${{ matrix.os }}${BUILD_IMAGE_SUFFIX}"
            echo "RUN getent passwd ubuntu >/dev/null 2>&1 || { \\"
            echo "      getent group ubuntu >/dev/null 2>&1 \\"
            echo "        || groupadd --non-unique -g ${runner_id} ubuntu; \\"
            echo "      useradd -l -u ${runner_id} -g ${runner_id} -m ubuntu; }"
          } > "${DOCKERFILE}"
          cat "${DOCKERFILE}"
      - name: Run the Yetus container as that account
        # Yetus takes the container account's name from SUDO_USER, and the ids
        # from id(1), which finds no such host account and yields nothing,
        # leaving its reaper and process counter useless. Those two lookups
        # are rewritten to fall back to the runner's own.
        run: |
          patch="${YETUS}/precommit/src/main/shell/core.d/01-common.sh"
          sed -i \
            -e 's|^  USER_ID=$(id -u "${USER_NAME}")$|  USER_ID=$(id -u "${USER_NAME}" 2>/dev/null \|\| id -u)|' \
            -e 's|^  GROUP_ID=$(id -g "${USER_NAME}")$|  GROUP_ID=$(id -g "${USER_NAME}" 2>/dev/null \|\| id -g)|' \
            "${patch}"
          grep -n 'USER_NAME=\|USER_ID=\|GROUP_ID=' "${patch}"
          if ! grep -q '2>/dev/null || id -u' "${patch}"; then
            echo "::warning::${YETUS_VERSION} is not the version these rewrites" \
              "were written for; the ids may come out empty."
          fi
          echo "SUDO_USER=ubuntu" >> "${GITHUB_ENV}"
      - name: Run Yetus
        run: |
          # Yetus' GitHub Actions support would test the pushed request
          # branch as a full build; with any other event name it tests the
          # patch below against trunk.
          export GITHUB_EVENT_NAME=workflow_call
          # jenkins.sh hands JIRA_ISSUE_KEY to Yetus as what to test.
          export JIRA_ISSUE_KEY="${PATCH_FILE}"
          bash "$SOURCEDIR/dev-support/jenkins.sh" run_ci
      - name: Clean up Yetus processes
        if: always()
        run: bash "$SOURCEDIR/dev-support/jenkins.sh" cleanup_ci_proc
      - name: Summarize the Yetus report
        if: always()
        run: |
          if [[ -f "${PATCHDIR}/console.txt" ]]; then
            {
              echo "### Yetus (${PLATFORM}) on ${UPSTREAM_BRANCH} ${UPSTREAM_COMMIT}"
              echo
              echo '```'
              head -c 500000 "${PATCHDIR}/console.txt"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload Yetus report
        # Like Jenkins: always for Ubuntu Noble, on failure for the optional
        # platforms.
        if: always() && (matrix.optional == '0' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: yetus-report-${{ matrix.platform }}
          path: out
          if-no-files-found: ignore

  report:
    name: Report on the upstream commit
    needs: [request, yetus]
    # A cancelled test was replaced by a newer request, which reports instead.
    if: ${{ !cancelled() && needs.request.result == 'success' && needs.yetus.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Set the Yetus commit status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.request.outputs.commit }}
          STATE: ${{ needs.yetus.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" --silent \
            -f state="${STATE}" -f context=Yetus -f description="Precommit: ${STATE}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
