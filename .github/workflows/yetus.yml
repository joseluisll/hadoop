name: "Yetus"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: yetus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  YETUS_VERSION: rel/0.14.1
  # Prebuilt Hadoop build image, published by apache/hadoop's "Image Cache"
  # workflow from Dockerfile_ubuntu_24 on trunk. Reusing it avoids building
  # the whole toolchain image on every run.
  YETUS_BASE_IMAGE: ghcr.io/apache/hadoop/gha-build-ubuntu_24-image-cache:trunk-static

jobs:
  yetus:
    name: Run Yetus precommit
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout Hadoop
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - name: Checkout Yetus
        uses: actions/checkout@v4
        with:
          repository: apache/yetus
          ref: ${{ env.YETUS_VERSION }}
          path: yetus
      - name: Pull Apache trunk build image
        run: |
          docker pull "${YETUS_BASE_IMAGE}"
          # Yetus builds whatever --dockerfile names as its base image.
          # A single FROM line makes that build a reuse of the pulled image.
          mkdir -p "${RUNNER_TEMP}/yetus-base"
          echo "FROM ${YETUS_BASE_IMAGE}" > "${RUNNER_TEMP}/yetus-base/Dockerfile"
      - name: Run Yetus
        env:
          WORKSPACE: ${{ github.workspace }}
          YETUS: yetus
          SOURCEDIR: ${{ github.workspace }}/src
          PATCHDIR: ${{ github.workspace }}/out
          DOCKERFILE: ${{ runner.temp }}/yetus-base/Dockerfile
          CHANGE_URL: ${{ github.event.pull_request.html_url }}
          PATCH_OR_ISSUE: ${{ github.event.pull_request.html_url }}
          BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          IS_OPTIONAL: "0"
        run: |
          git -C "$SOURCEDIR" fetch origin "${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || true
          bash "$SOURCEDIR/dev-support/jenkins.sh" run_ci
      - name: Upload Yetus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yetus-report
          path: out
