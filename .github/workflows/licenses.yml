# Collect third-party dependency licenses with
# org.codehaus.mojo:license-maven-plugin. Offline-first: license texts
# are resolved from the versioned store in dev-support/licenses/texts/;
# downloading from the network only happens when explicitly requested
# via the workflow_dispatch "download" input.
# See dev-support/licenses/README.md.
name: Collect dependency licenses

on:
  push:
    branches:
      - LICENSES
  workflow_dispatch:
    inputs:
      download:
        description: Also download license texts from the network
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The aggregate goals resolve dependency artifacts from the local
      # repository, so the full reactor must be installed first: every
      # module must be covered, none may be skipped.
      - name: Install reactor modules
        run: >-
          mvn -B -ntp install
          -DskipTests -Dmaven.javadoc.skip=true
          -Dcheckstyle.skip=true -Drat.skip=true -Dspotbugs.skip=true

      # inventory only: no downloads in the default run
      - name: Build THIRD-PARTY inventory
        run: >-
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party

      - name: Resolve license texts from the local store
        run: >-
          dev-support/licenses/resolve-licenses.sh
          target/third-party/THIRD-PARTY.txt
          dev-support/licenses/texts
          target/licenses-resolved

      # optional, on demand only
      - name: Download license texts from the network
        if: inputs.download
        run: >-
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses
          && dev-support/licenses/normalize-licenses.sh
          target/licenses
          target/licenses-downloaded

      - name: Upload reports and license texts
        uses: actions/upload-artifact@v4
        with:
          name: collected-licenses
          path: |
            **/target/third-party/**
            **/target/licenses-resolved/**
            **/target/licenses-downloaded/**
          if-no-files-found: error
