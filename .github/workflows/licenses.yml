# Prototype: collect third-party dependency licenses with
# org.codehaus.mojo:license-maven-plugin. See dev-support/licenses/README.md.
name: Collect dependency licenses

on:
  push:
    branches:
      - LICENSES
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The aggregate goals resolve dependency artifacts from the local
      # repository, so the reactor modules must be installed first.
      # Scoped to hadoop-common to keep the prototype fast; drop -pl/-am
      # after a full `mvn install -DskipTests` to cover every module.
      - name: Install reactor modules
        run: >-
          mvn -B -ntp install
          -DskipTests -Dmaven.javadoc.skip=true
          -Dcheckstyle.skip=true -Drat.skip=true
          -pl hadoop-common-project/hadoop-common -am

      - name: Collect licenses
        run: >-
          mvn -B -ntp -Plicenses -DskipTests process-sources
          -pl hadoop-common-project/hadoop-common -am

      - name: Upload THIRD-PARTY reports and license texts
        uses: actions/upload-artifact@v4
        with:
          name: collected-licenses
          path: |
            **/target/third-party/**
            **/target/licenses/**
          if-no-files-found: error
