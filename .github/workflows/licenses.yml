# Collect third-party dependency licenses with
# org.codehaus.mojo:license-maven-plugin. Offline-first: license texts
# are resolved from the versioned store in dev-support/licenses/texts/;
# downloading from the network only happens when explicitly requested
# via the workflow_dispatch "download" input.
# See dev-support/licenses/README.md.
name: Collect dependency licenses

on:
  push:
    branches:
      - feat/LICENSES
  workflow_dispatch:
    inputs:
      download:
        description: Also download license texts from the network
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The aggregate goals resolve dependency artifacts from the local
      # repository, so the full reactor must be installed first: every
      # module must be covered, none may be skipped.
      - name: Install reactor modules
        run: >-
          mvn -B -ntp install
          -DskipTests -Dmaven.javadoc.skip=true
          -Dcheckstyle.skip=true -Drat.skip=true -Dspotbugs.skip=true

      # inventory only: no downloads in the default run.
      # The goal is invoked directly on the root aggregator, so the reactor
      # summary marks every other module SKIPPED (no lifecycle goal runs for
      # them in this session; the aggregator walks all reactor POMs
      # in-process instead). Those 118 dotted rows are noise — filter them
      # from the log while keeping mvn's exit code (pipefail) and every
      # other line.
      - name: Build THIRD-PARTY inventory
        run: >-
          set -o pipefail;
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party
          | grep -vE '( |\.)*SKIPPED$'

      # keep going on failure: resolve and upload whatever was produced.
      # --strict: a detected license with no local text (or an HTML junk
      # text) fails the run, so the store stays complete.
      - name: Resolve license texts from the local store
        if: always()
        run: >-
          dev-support/licenses/resolve-licenses.sh
          target/third-party/THIRD-PARTY.txt
          dev-support/licenses/texts
          target/licenses-resolved
          --strict

      # requirement 10 (drift detection): the committed LICENSE-binary is
      # the artifact of record, generated from the archives by R40 and
      # validated by the dist workflow. This gate fails when it drifts
      # from the last archive-derived manifest. (It replaces the R25
      # parity gate against the hand-maintained manifest, retired with
      # the Stage 3 switch.)
      - name: Drift gate vs the last archive-derived manifest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf_id="$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name == "Archive license ground truth") | .id')"
          if [[ -z "$wf_id" ]]; then
            echo "R10 FAILURE: Archive license ground truth workflow not registered" >&2
            exit 1
          fi
          branch="${GITHUB_REF_NAME}"
          last_run="$(gh api "repos/${{ github.repository }}/actions/workflows/$wf_id/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$branch\")][0].id")"
          if [[ -z "$last_run" ]]; then
            echo "R10 FAILURE: no successful archive ground-truth run on branch $branch to compare against" >&2
            exit 1
          fi
          echo "comparing against archive ground-truth run $last_run"
          rm -rf target/last-dist-manifest
          gh run download "$last_run" -n archive-ground-truth -D target/last-dist-manifest
          if [[ ! -s target/last-dist-manifest/generated-LICENSE-binary ]]; then
            echo "R10 FAILURE: run $last_run published no generated-LICENSE-binary" >&2
            exit 1
          fi
          if ! diff -u target/last-dist-manifest/generated-LICENSE-binary LICENSE-binary; then
            echo "R10 DRIFT: committed LICENSE-binary differs from the manifest generated by run $last_run — dispatch the archive workflow and commit the regenerated file" >&2
            exit 1
          fi
          echo "R10 drift gate: committed LICENSE-binary matches run $last_run"

      # optional, on demand only
      - name: Download license texts from the network
        if: always() && inputs.download
        run: >-
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses
          && dev-support/licenses/normalize-licenses.sh
          target/licenses
          target/licenses-downloaded

      - name: Upload reports and license texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-licenses
          path: |
            **/target/third-party/**
            **/target/licenses-resolved/**
            **/target/licenses-downloaded/**
          if-no-files-found: warn
