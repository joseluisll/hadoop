# Collect third-party dependency licenses with
# org.codehaus.mojo:license-maven-plugin. Offline-first: license texts
# are resolved from the versioned store in dev-support/licenses/texts/;
# downloading from the network only happens when explicitly requested
# via the workflow_dispatch "download" input.
# See dev-support/licenses/README.md.
name: Collect dependency licenses

on:
  push:
    branches:
      - feat/LICENSES-3.5
  workflow_dispatch:
    inputs:
      download:
        description: Also download license texts from the network
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The aggregate goals resolve dependency artifacts from the local
      # repository, so the full reactor must be installed first: every
      # module must be covered, none may be skipped.
      - name: Install reactor modules
        run: >-
          mvn -B -ntp install
          -DskipTests -Dmaven.javadoc.skip=true
          -Dcheckstyle.skip=true -Drat.skip=true -Dspotbugs.skip=true

      # inventory only: no downloads in the default run.
      # The goal is invoked directly on the root aggregator, so the reactor
      # summary marks every other module SKIPPED (no lifecycle goal runs for
      # them in this session; the aggregator walks all reactor POMs
      # in-process instead). Those 118 dotted rows are noise — filter them
      # from the log while keeping mvn's exit code (pipefail) and every
      # other line.
      - name: Build THIRD-PARTY inventory
        run: >-
          set -o pipefail;
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party
          | grep -vE '( |\.)*SKIPPED$'

      # keep going on failure: resolve and upload whatever was produced.
      # --strict: a detected license with no local text (or an HTML junk
      # text) fails the run, so the store stays complete.
      - name: Resolve license texts from the local store
        if: always()
        run: >-
          dev-support/licenses/resolve-licenses.sh
          target/third-party/THIRD-PARTY.txt
          dev-support/licenses/texts
          target/licenses-resolved
          --strict

      # requirement 10 (drift detection): the committed LICENSE-binary is
      # the artifact of record, generated from the archives by R40 and
      # validated by the dist workflow. This gate fails when it drifts
      # from the last archive-derived manifest. (It replaces the R25
      # parity gate against the hand-maintained manifest, retired with
      # the Stage 3 switch.)
      #
      # Selection is commit-aware, branching on the state of the archive
      # run for THIS commit:
      # - succeeded: that run's own R40 gate is the like-for-like
      #   authority (it compares the committed file against a manifest
      #   generated from its own archives) — defer to it.
      # - still running: the comparison would read a stale baseline (the
      #   40+-minute archive run has not published its manifest yet), so
      #   defer; when it finishes it validates the manifest itself, and
      #   if it fails the branch shows a red run.
      # - failed: the committed manifest was never validated for this
      #   commit — fail here too rather than silently pass.
      # Only when this commit has no archive run is the previous commit's
      # baseline a valid comparison target: since R42 (review F1) the dist
      # path filter covers every pom.xml and the assembly descriptors, so a
      # commit that misses the filter changed neither LICENSE-binary nor any
      # manifest input.
      - name: Drift gate vs the last archive-derived manifest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf_id="$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name == "Archive license ground truth") | .id')"
          if [[ -z "$wf_id" ]]; then
            echo "R10 FAILURE: Archive license ground truth workflow not registered" >&2
            exit 1
          fi
          branch="${GITHUB_REF_NAME}"
          # R43: every failure below prints the exact recovery command —
          # dispatch the archive run (workflow_dispatch is registered on this
          # branch because the workflow runs via push; the schedule is inert
          # on the fork, R43/review F2).
          recover="gh workflow run $wf_id --repo ${{ github.repository }} --ref $branch   # or: gh api -X POST repos/${{ github.repository }}/actions/workflows/$wf_id/dispatches -f ref=$branch"
          # per_page=1: the newest run for the commit is the authoritative
          # one. Re-runs reuse the run id (a re-run of a failed run reads
          # as in_progress, so it defers until it finishes); a later
          # dispatch-triggered run for the same SHA sorts newest-first.
          # "unknown", not "pending", for a null conclusion: a completed
          # run with no conclusion must FAIL below, never defer.
          same_sha_run="$(gh api "repos/${{ github.repository }}/actions/workflows/$wf_id/runs?head_branch=$branch&head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "" else "\(.id) \(.status) \(.conclusion // "unknown")" end')"
          if [[ -n "$same_sha_run" ]]; then
            run_id="${same_sha_run%% *}"
            if grep -qE ' (in_progress|queued|waiting|pending)( |$)' <<<"$same_sha_run"; then
              echo "R10 drift gate: archive run $run_id for this commit is still running ($same_sha_run) — its own R40 gate validates the committed manifest like-for-like; skipping the cross-commit comparison"
              exit 0
            fi
            if ! grep -q ' completed success' <<<"$same_sha_run"; then
              echo "R10 FAILURE: archive run $run_id for this commit did not validate the manifest ($same_sha_run) — triage that run; until it succeeds the committed LICENSE-binary has no like-for-like validation" >&2
              exit 1
            fi
            echo "R10 drift gate: archive run $run_id for this commit succeeded ($same_sha_run) — its own R40 gate validated the committed manifest like-for-like; skipping the cross-commit comparison"
            exit 0
          fi
          last_run="$(gh api "repos/${{ github.repository }}/actions/workflows/$wf_id/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$branch\")][0].id")"
          if [[ -z "$last_run" ]]; then
            echo "R10 FAILURE: no successful archive ground-truth run on branch $branch to compare against — the baseline is missing or expired (retention: R43). Recover: $recover" >&2
            exit 1
          fi
          echo "comparing against archive ground-truth run $last_run"
          rm -rf target/last-dist-manifest
          if ! gh run download "$last_run" -n archive-ground-truth -D target/last-dist-manifest; then
            echo "R10 FAILURE: could not download the baseline artifact of run $last_run (deleted or expired — R43). Recover: $recover" >&2
            exit 1
          fi
          if [[ ! -s target/last-dist-manifest/generated-LICENSE-binary ]]; then
            echo "R10 FAILURE: run $last_run published no generated-LICENSE-binary. Recover: $recover" >&2
            exit 1
          fi
          if ! diff -u target/last-dist-manifest/generated-LICENSE-binary LICENSE-binary; then
            echo "R10 DRIFT: committed LICENSE-binary differs from the manifest generated by run $last_run — recover: $recover, then commit the regenerated target file's diff as LICENSE-binary" >&2
            exit 1
          fi
          echo "R10 drift gate: committed LICENSE-binary matches run $last_run"

      # requirements 7 (stage B), 48 and 53, one script:
      # - every path-style entry in the curated non-jar asset manifest
      #   must still resolve in the source tree — a stale entry silently
      #   lists an absent asset and hides the asset that shipped in its
      #   place (see the 2026-11-08 R7 record);
      # - every path the source-release LICENSE.txt names must resolve,
      #   and every shipped asset path must be listed in it;
      # - every component-specific text in the texts/ store must still
      #   be referenced by LICENSE-binary — the tarball's licenses-binary/
      #   directory is generated from the manifest and the store (R13),
      #   so a stale text would ship for a component that is gone
      #   (licenses-binary-aliases maps the texts named differently;
      #   texts-generic lists resolve-store texts that never ship).
      - name: Source-tree licence gates (assets, LICENSE.txt, texts store)
        if: always()
        run: python3 dev-support/licenses/check-asset-manifest.py

      # optional, on demand only
      - name: Download license texts from the network
        if: always() && inputs.download
        run: >-
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses
          && dev-support/licenses/normalize-licenses.sh
          target/licenses
          target/licenses-downloaded

      - name: Upload reports and license texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-licenses
          path: |
            **/target/third-party/**
            **/target/licenses-resolved/**
            **/target/licenses-downloaded/**
          if-no-files-found: warn
