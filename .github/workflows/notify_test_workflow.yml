# Intentionally has a general name.
# because the test status check created in GitHub Actions
# currently randomly picks any associated workflow.
# So, the name was changed to make sense in that context too.
# See also https://github.community/t/specify-check-suite-when-creating-a-checkrun/118380/10

name: "PR update"

# Security: `pull_request_target` events can be risky, but we:
# 1. Only grant write access for checks (a.k.a. check runs).
# 2. We are careful with untrusted inputs (i.e. don't use user-supplied
#    variables in ways vulnerable to shell injection, etc.)
# 3. We don't check out the fork's head ref.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  notify:
    name: "Notify Test Workflow"
    # Fork-only: run only for Hadoop JIRA branches (HADOOP-, HDFS-, YARN-, MAPREDUCE-),
    # but not their <branch>-upstream copies built for apache/hadoop.
    if: >-
      (startsWith(github.head_ref, 'HADOOP-') || startsWith(github.head_ref, 'HDFS-') ||
      startsWith(github.head_ref, 'YARN-') || startsWith(github.head_ref, 'MAPREDUCE-')) &&
      !endsWith(github.head_ref, '-upstream')
    runs-on: ubuntu-slim
    permissions:
      actions: read
      checks: write
    steps:
      - name: "Notify Test Workflow"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const endpoint = 'GET /repos/:owner/:repo/actions/workflows/:id/runs?branch=:branch&head_sha=:head_sha'
            const check_run_endpoint = 'GET /repos/:owner/:repo/commits/:ref/check-runs?per_page=100'

            // TODO: Should use pull_request.user and pull_request.user.repos_url?
            // If a different person creates a commit to another forked repo,
            // it wouldn't be able to detect.
            const params = {
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              id: 'build_and_test.yml',
              branch: context.payload.pull_request.head.ref,
              head_sha: context.payload.pull_request.head.sha,
            }
            const check_run_params = {
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              ref: context.payload.pull_request.head.sha,
            }

            console.log('Ref: ' + context.payload.pull_request.head.ref)
            console.log('SHA: ' + context.payload.pull_request.head.sha)

            const sleep = (ms) => new Promise(r => setTimeout(r, ms))
            const MAX_ATTEMPTS = 10
            const RETRY_DELAY_MS = 3000

            // Poll until the fork's workflow run for exactly this head SHA shows up.
            // The fork may take a few seconds to trigger its workflow after the push.
            let runs
            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              await sleep(RETRY_DELAY_MS)
              try {
                runs = await github.request(endpoint, params)
              } catch (error) {
                console.error(error)
                // Assume that runs were not found yet.
                runs = undefined
              }
              if (runs && runs.data.workflow_runs.some(r => r.head_sha === params.head_sha)) {
                break
              }
              console.log(`Workflow run for ${params.head_sha} not found yet (attempt ${attempt}/${MAX_ATTEMPTS})`)
            }

            const name = 'Build'
            const head_sha = context.payload.pull_request.head.sha
            let status = 'queued'

            const matching_run = runs
              ? runs.data.workflow_runs.find(r => r.head_sha === head_sha)
              : undefined

            if (!matching_run) {
              status = 'completed'
              const conclusion = 'action_required'

              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                head_sha: head_sha,
                status: status,
                conclusion: conclusion,
                output: {
                  title: 'Workflow run detection failed',
                  summary: `
            Unable to detect the workflow run for testing the changes in your PR.

            1. If you did not enable GitHub Actions in your forked repository, please enable it by clicking the button as shown in the image below. See also [Managing Github Actions Settings for a repository](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository).
            2. It is possible your branch is based on the old \`trunk\` branch in Apache Hadoop, please sync your branch to the latest trunk branch. For example as below:
                \`\`\`bash
                git fetch upstream
                git rebase upstream/trunk
                git push origin YOUR_BRANCH --force
                \`\`\``,
                  images: [
                    {
                      alt: 'enabling workflows button',
                      image_url: 'https://raw.githubusercontent.com/apache/hadoop/trunk/.github/workflows/images/workflow-enable-button.png'
                    }
                  ]
                }
              })
            } else {
              const run_id = matching_run.id

              // Here we get check run ID to provide Check run view instead of Actions view, see also HADOOP-19858.
              let check_run_head;
              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                const check_runs = await github.request(check_run_endpoint, check_run_params);
                check_run_head = check_runs.data.check_runs.find(
                  r => r.name === "Run / Preparation" && r.head_sha === head_sha
                );
                if (check_run_head) {
                  break;
                }
                if (attempt < MAX_ATTEMPTS) {
                  await sleep(RETRY_DELAY_MS);
                }
              }
              if (!check_run_head) {
                throw new Error(`Failed to retrieve check_run_head for ${head_sha} after ${MAX_ATTEMPTS} attempts`);
              }

              const check_run_url = 'https://github.com/'
                + context.payload.pull_request.head.repo.full_name
                + '/runs/'
                + check_run_head.id
              console.log('Check run URL: ' + check_run_url)

              const actions_url = 'https://github.com/'
                + context.payload.pull_request.head.repo.full_name
                + '/actions/runs/'
                + run_id
              console.log('Actions URL: ' + actions_url)

              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                head_sha: head_sha,
                status: status,
                output: {
                  title: 'Test results',
                  summary: '[See test results](' + check_run_url + ')',
                  text: JSON.stringify({
                    owner: context.payload.pull_request.head.repo.owner.login,
                    repo: context.payload.pull_request.head.repo.name,
                    run_id: run_id
                  })
                },
                details_url: actions_url,
              })
            }
