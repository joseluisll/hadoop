# Fork-only: the Jetty 12 phase A harness for the "ha" architecture: namenode
# HA over QJM with ZKFC, RM HA, failover; unit suite: Hadoop's HA tests.
# Builds the baseline and the candidate, runs both, compares them; see
# tmpl_jetty12_phase_a.yml and dev-support/jetty12-phase-a/README.md.
#
# Started by hand: "Run workflow" in the Actions tab once this file is on the
# default branch, or pushing a tag or a branch named jetty12-phase-a-ha-run-*,
# which runs that commit as the candidate against PREPARATION:
#   git tag jetty12-phase-a-ha-run-1 origin/HADOOP-99999
#   git push origin jetty12-phase-a-ha-run-1

name: "Jetty 12 phase A: ha"

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Baseline branch, tag or commit (without the patch)"
        default: "PREPARATION"
      candidate_ref:
        description: "Candidate branch, tag or commit (with the patch)"
        default: "HADOOP-99999"
      maven_mirror:
        description: "Maven Central mirror URL, if repo.maven.apache.org rate-limits"
        default: ""
  push:
    tags:
      - "jetty12-phase-a-ha-run-*"
    branches:
      - "jetty12-phase-a-ha-run-*"

permissions:
  contents: read
  # the template's queue job reads the other harness runs
  actions: read

concurrency:
  group: jetty12-phase-a-ha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness:
    name: Harness
    uses: ./.github/workflows/tmpl_jetty12_phase_a.yml
    with:
      arch: ha
      unit_suites: '["ha"]'
      baseline_ref: ${{ inputs.baseline_ref || 'PREPARATION' }}
      candidate_ref: ${{ inputs.candidate_ref || github.sha }}
      unit_tier: ${{ inputs.unit_tier || 'quick' }}
      maven_mirror: ${{ inputs.maven_mirror || '' }}
