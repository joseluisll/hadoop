# Fork-only: each push to a Hadoop JIRA branch (HADOOP-, HDFS-, YARN-,
# MAPREDUCE-) builds the commit for its apache/hadoop pull request with
# .github/scripts/make-upstream-branch.sh and stages it as the tag
# staged/<branch>-upstream. No pull request into PREPARATION is needed.
# Branches that only change .github/ get no upstream commit, and a push that
# leaves it unchanged does not push the tag again.
#
# Nothing is built automatically. Pushing a branch would start
# apache/hadoop's build_and_test.yml on it, but every apache/hadoop workflow
# started by a push is limited to branches, so pushing a tag starts none.
# <branch>-upstream itself only moves, and gets its Build run, on request
# (see build_upstream.yml); Yetus also only runs on request (see yetus.yml).
# Then PREPARATION is rebuilt as apache/hadoop trunk plus .github/
# (rebuild_preparation.yml), so it keeps following trunk.
#
# A push with [skip ci] in its commit message runs none of this.
#
# Pushes with the PREPARATION_PUSH_TOKEN secret (a token with contents and
# workflows write access), since GITHUB_TOKEN cannot push apache/hadoop
# commits that change .github/workflows/.

name: "Upstream branch"

on:
  push:
    # Hadoop JIRA branches, but never their <branch>-upstream copies.
    branches:
      - "HADOOP-**"
      - "HDFS-**"
      - "YARN-**"
      - "MAPREDUCE-**"
      - "!**-upstream"

permissions:
  contents: write

jobs:
  upstream-branch:
    name: Stage the upstream commit
    # Not when the branch is deleted.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    # One run per feature at a time, so pushes are staged in order.
    concurrency:
      group: upstream-branch-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      FEATURE: ${{ github.ref_name }}
      # Author and committer of the upstream commit; Claude is added as co-author.
      UPSTREAM_AUTHOR: "Jose Luis López López <joseluisll@gmail.com>"
    steps:
      - name: Checkout the pushed feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push apache/hadoop commits that change
          # .github/workflows/.
          token: ${{ secrets.PREPARATION_PUSH_TOKEN || github.token }}
      - name: Build and stage the upstream commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          feature_commit=${GITHUB_SHA}
          # The apache/hadoop trunk commit the feature is based on, not the
          # current PREPARATION, which may have been rebuilt on a newer trunk
          # since. PREPARATION only adds .github/ to trunk, which the script
          # leaves out anyway.
          git remote add apache https://github.com/apache/hadoop.git
          git fetch --quiet --no-tags apache trunk
          base_commit=$(git merge-base FETCH_HEAD "${feature_commit}")
          # Keep a copy of the script: it checks out apache/hadoop trunk.
          script="${RUNNER_TEMP}/make-upstream-branch.sh"
          cp .github/scripts/make-upstream-branch.sh "${script}"
          status=0
          BASE_COMMIT="${base_commit}" FEATURE_COMMIT="${feature_commit}" \
            bash "${script}" "${FEATURE}" || status=$?
          if [[ ${status} -eq 3 ]]; then
            echo "::notice::${FEATURE} only changes .github/; no upstream branch needed."
            exit 0
          elif [[ ${status} -ne 0 ]]; then
            exit "${status}"
          fi
          staged="staged/${FEATURE}-upstream"
          # Nothing changed for apache/hadoop (e.g. a push that only touched
          # .github/): keep the staged commit as it is.
          if git fetch --quiet --no-tags origin "refs/tags/${staged}" 2>/dev/null &&
              [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "::notice::${staged} is already up to date."
            exit 0
          fi
          # A tag, so no Build starts; build_upstream.yml publishes it.
          git push --force origin "HEAD:refs/tags/${staged}"
          echo "::notice::Staged ${staged}. To publish it as ${FEATURE}-upstream and build it: git push origin PREPARATION:build/${FEATURE}-upstream"

  rebuild-preparation:
    name: Rebuild PREPARATION
    needs: upstream-branch
    uses: ./.github/workflows/rebuild_preparation.yml
    secrets: inherit
