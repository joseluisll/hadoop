# Fork-only: publish a staged upstream commit as the <name> branch, which
# the apache/hadoop pull request is opened from, and so start its Build run,
# only when requested. Request it by pushing a build/<name> branch that
# carries this file, e.g.:
#
#   git push origin PREPARATION:build/HADOOP-12345
#
# (workflow_dispatch would need this file on trunk, the fork's default
# branch). The request branch is deleted at the end, so the same push works
# again later. "Upstream branch" (upstream_branch.yml) stages the commit as
# the tag staged/<name> on each push to feat/<name>. Pull requests opened
# before feat/ branches, from <name>-upstream, are updated with
# build/<name>-upstream, which publishes staged/<name> there.
#
# It never overwrites work: an existing branch is only replaced when it is
# what this workflow publishes (one commit on apache/hadoop trunk) or when
# feat/<name> already contains it.
#
# Pushing the branch starts apache/hadoop's build_and_test.yml on it, the
# run apache/hadoop's "Build" check looks for in this fork. A push that
# leaves the branch where it is starts nothing, so when the staged commit is
# already published, the same commit is published again with a new
# committer date, and the tag is moved along with it.
#
# Needs the PREPARATION_PUSH_TOKEN secret (a token with contents and
# workflows write access): a push with GITHUB_TOKEN starts no workflows.

name: "Build upstream branch"

on:
  push:
    branches:
      - "build/HADOOP-*"
      - "build/HDFS-*"
      - "build/YARN-*"
      - "build/MAPREDUCE-*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish and build
    # Not when a request branch is deleted.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    concurrency:
      group: build-upstream-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      HAS_PUSH_TOKEN: ${{ secrets.PREPARATION_PUSH_TOKEN != '' }}
    steps:
      - name: Check for PREPARATION_PUSH_TOKEN
        if: env.HAS_PUSH_TOKEN != 'true'
        run: |
          echo "::error::PREPARATION_PUSH_TOKEN is not set; without it the push starts no Build."
          exit 1
      - name: Checkout
        # Only to push with the token; the commit comes from the staged tag.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
          token: ${{ secrets.PREPARATION_PUSH_TOKEN }}
      - name: Publish the staged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=${GITHUB_REF_NAME#build/}
          # <name>, or <name>-upstream for pull requests opened before feat/.
          name=${branch%-upstream}
          staged="staged/${name}"
          if ! git fetch --quiet --no-tags --depth=2 origin "refs/tags/${staged}" 2>/dev/null; then
            echo "::error::Nothing is staged as ${staged}: push feat/${name} (with the current PREPARATION merged) first."
            exit 1
          fi
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          published=$(git ls-remote origin "refs/heads/${branch}" | cut -f1)
          if [[ -n "${published}" && "${published}" != "${commit}" ]]; then
            # Only replace a branch that feat/<name> contains, or one commit
            # on apache/hadoop trunk (what this workflow publishes).
            feat=$(git ls-remote origin "refs/heads/feat/${name}" | cut -f1)
            contained=
            if [[ -n "${feat}" ]]; then
              contained=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${published}...${feat}" \
                --jq .status 2>/dev/null) || contained=
            fi
            parents=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${published}" \
              --jq '[.parents[].sha] | join(" ")')
            on_trunk=
            if [[ -n "${parents}" && "${parents}" != *" "* ]]; then
              on_trunk=$(gh api "repos/apache/hadoop/compare/${parents}...trunk" \
                --jq .status 2>/dev/null) || on_trunk=
            fi
            if [[ "${contained}" != ahead && "${contained}" != identical &&
                  "${on_trunk}" != ahead && "${on_trunk}" != identical ]]; then
              echo "::error::${branch} holds work that is not in feat/${name}; rename it to feat/${name} (or merge it there) first."
              exit 1
            fi
          fi
          refs=()
          if [[ "${published}" == "${commit}" ]]; then
            # Same author and message, new committer date, so the push moves
            # the branch and starts a Build.
            IFS='|' read -r a_name a_email a_date < <(git log -1 --format='%an|%ae|%aI' "${commit}")
            commit=$(GIT_AUTHOR_NAME="${a_name}" GIT_AUTHOR_EMAIL="${a_email}" GIT_AUTHOR_DATE="${a_date}" \
              GIT_COMMITTER_NAME="${a_name}" GIT_COMMITTER_EMAIL="${a_email}" \
              git commit-tree "${commit}^{tree}" -p "${commit}^" \
                -F <(git cat-file commit "${commit}" | sed '1,/^$/d'))
            refs+=("+${commit}:refs/tags/${staged}")
          fi
          refs+=("+${commit}:refs/heads/${branch}")
          git push origin "${refs[@]}"
          echo "::notice::Published ${branch} at ${commit}; its Build run starts from that push."
      - name: Delete the request
        # Last, as the checkout fetches the request's commit; also after a failure.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
