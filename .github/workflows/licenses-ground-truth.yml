# Licenses: ground truth — the standing validation of the license
# system, in one workflow with two dependent jobs:
#   job archive-ground-truth: build the distribution tarballs in the
#     Docker build env, enumerate every shipped jar, run the archive
#     gates (coverage, jar-naming, inventory, exclusions, assets),
#     regenerate LICENSE-binary from this run's archives (drift gate)
#     and the bundled texts (texts gate), publish the
#     archive-ground-truth artifact (the evidence of record), and run
#     the pruning dry-run reports;
#   job source-gates (needs the archive job): validate the committed
#     state against THIS run's output — the drift gate (committed
#     LICENSE-binary == the generated manifest), the texts store in
#     strict mode, the source-tree battery (asset manifest, LICENSE.txt,
#     NOTICE coverage) — and publish collected-licenses.
# The two jobs used to be two workflows ("Archive license ground
# truth" / "Collect dependency licenses"); the collect job always
# consumed the archive job's baseline, so they are one workflow now and
# the cross-run baseline lookup is gone with it.
#
# TRIGGER PLAN (owner, 2026-11-12): the per-push/per-PR license gates
# were rejected by the community — the checks run ONE SHOT during RC
# preparation (the release workflows call the same checks via
# run-release-checks.sh) and on a schedule as the standing refresh.
# No push trigger.

name: "Licenses: ground truth (archive + source gates)"

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      download:
        description: Also download license texts from the network (source-gates job)
        type: boolean
        default: false

jobs:
jobs:
  archive:
    uses: ./.github/workflows/licenses-archive-build.yml
    permissions:
      contents: read
      packages: write
      actions: read

  source-gates:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download this run's archive ground truth
        uses: actions/download-artifact@v4
        with:
          name: archive-ground-truth

      - name: "Drift gate: committed manifest vs this run's generated manifest"
        run: |
          set -euo pipefail
          if [[ ! -s target/generated-LICENSE-binary ]]; then
            echo "drift FAILURE: the archive job published no generated-LICENSE-binary" >&2
            exit 1
          fi
          if ! diff -u LICENSE-binary target/generated-LICENSE-binary; then
            echo "drift: committed LICENSE-binary differs from the manifest generated by this run's archives — regenerate (python3 dev-support/licenses/generate-archive-manifest.py --inventory target/third-party/THIRD-PARTY.txt --archive-tsv target/archive-ground-truth/*/archive-jars.tsv --out LICENSE-binary), then commit the diff" >&2
            exit 1
          fi
          echo "drift gate: committed LICENSE-binary matches this run's archive ground truth"

      # --strict: a detected license with no local text (or an HTML junk
      # text) fails the run, so the store stays complete
      - name: Resolve license texts from the local store
        if: always()
        run: >-
          dev-support/licenses/resolve-licenses.sh
          target/third-party/THIRD-PARTY.txt
          dev-support/licenses/texts
          target/licenses-resolved
          --strict

      # one script, three gates: every curated asset-manifest path still
      # resolves in the source tree (assets); every path the source-release
      # LICENSE.txt names resolves and every shipped asset is listed
      # (license-txt); every component-specific store text is still
      # referenced by LICENSE-binary (texts); plus NOTICE-binary coverage
      # (notice) — attribution-required components must be mentioned,
      # covered by a copyright-carrying text, or justified in
      # notice-exceptions (self-cleaning both directions)
      - name: Source-tree gates (assets, license-txt, texts, notice)
        if: always()
        run: python3 dev-support/licenses/check-asset-manifest.py

      # optional, on demand only (dispatch input)
      - name: Download license texts from the network
        if: always() && inputs.download
        run: >-
          mvn -B -ntp -Plicenses -DskipTests
          org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses
          && dev-support/licenses/normalize-licenses.sh
          target/licenses
          target/licenses-downloaded

      - name: Upload collected reports and license texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-licenses
          path: |
            **/target/third-party/**
            **/target/licenses-resolved/**
            **/target/licenses-downloaded/**
          if-no-files-found: warn
