# Fork-only: what every job of tmpl_jetty12_phase_a.yml needs before running
# the harness: disk space, JDK 17, the two refs resolved to commits, and the
# Maven download cache.

name: "Jetty 12 phase A harness setup"
description: "Prepare a runner for dev-support/jetty12-phase-a"
inputs:
  baseline:
    description: "Baseline ref"
    required: true
  candidate:
    description: "Candidate ref"
    required: true
  free-disk:
    description: "Remove preinstalled toolchains the build does not need"
    default: "true"
runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost /usr/local/.ghcup
        df -h / | tail -1
    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 17
    - name: Resolve refs
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
      run: |
        resolve() {
          git rev-parse --verify -q "origin/$1^{commit}" || git rev-parse --verify -q "$1^{commit}" || echo "$1"
        }
        echo "BASELINE_REF=$(resolve "${BASELINE}")" >> "${GITHUB_ENV}"
        echo "CANDIDATE_REF=$(resolve "${CANDIDATE}")" >> "${GITHUB_ENV}"
        mkdir -p "${WORKDIR}"
    - uses: actions/cache@v4
      with:
        path: ${{ env.WORKDIR }}/m2/cached
        key: jetty12-phase-a-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: jetty12-phase-a-m2-
